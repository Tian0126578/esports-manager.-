services:
  esports-game:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${ESM_HTTP_PORT:-8000}:8000"
    environment:
      ESM_DATABASE_URL: sqlite+aiosqlite:////data/app.db
      ESM_COOKIE_SECURE: ${ESM_COOKIE_SECURE:-false}
    volumes:
      - esports-game-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  esports-game-data:
